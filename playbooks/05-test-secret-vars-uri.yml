---
- name: Direct Vault Secret Lookup via Native REST API (AppRole Auth)
  hosts: mini-lab
  vars:
    # Read environment variables injected by AWX Credential (or system env / extra vars)
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default('http://<SERVER_IP>:8200', true) }}"
    vault_role_id: "{{ lookup('env', 'VAULT_ROLE_ID') | default(role_id | default(''), true) }}"
    vault_secret_id: "{{ lookup('env', 'VAULT_SECRET_ID') | default(secret_id | default(''), true) }}"

  tasks:
    - name: Verify AppRole environment connection variables
      ansible.builtin.assert:
        that:
          - vault_role_id != ''
          - vault_secret_id != ''
        fail_msg: "VAULT_ROLE_ID or VAULT_SECRET_ID is missing! Make sure AppRole credentials are provided."
        success_msg: "AppRole credentials found for Vault at {{ vault_addr }}"

    - name: Authenticate to Vault via AppRole (Exchange Role ID & Secret ID for Token)
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ vault_role_id }}"
          secret_id: "{{ vault_secret_id }}"
        status_code: 200
      register: vault_login_response
      no_log: true

    - name: Extract temporary Vault client token
      ansible.builtin.set_fact:
        vault_client_token: "{{ vault_login_response.json.auth.client_token }}"

    - name: Query Vault KV v2 API using temporary AppRole token
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/kv/data/ansible"
        headers:
          X-Vault-Token: "{{ vault_client_token }}"
        method: GET
        status_code: 200
      register: vault_api_response

    - name: Extract secret key variables
      ansible.builtin.set_fact:
        git_pat: "{{ vault_api_response.json.data.data.git_pat | default('') }}"
        git_user: "{{ vault_api_response.json.data.data.git_user | default('') }}"
        test_secret: "{{ vault_api_response.json.data.data.test_secret | default('') }}"
        target_user: "{{ vault_api_response.json.data.data.target_user | default('') }}"

    - name: Display retrieved secrets summary
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - " NATIVE REST API APPROLE LOOKUP SUMMARY            "
          - "=================================================="
          - " Vault Server URL : {{ vault_addr }}"
          - " Git User         : {{ git_user }}"
          - " Target User      : {{ target_user }}"
          - " Git PAT Length   : {{ git_pat | length }} chars"
          - " Test Secret      : {{ test_secret[0:2] }}***{{ test_secret[-2:] if (test_secret | length) > 3 else '' }}"
          - "=================================================="
      no_log: false

    - name: Confirm secrets were extracted successfully
      ansible.builtin.assert:
        that:
          - git_pat != ''
          - git_user != ''
          - test_secret != ''
          - target_user != ''
        fail_msg: "Failed to extract secrets from kv/data/ansible in Vault using AppRole!"
        success_msg: "All secrets successfully fetched via native REST API with AppRole!"
