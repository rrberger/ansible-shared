---
- name: Direct Vault Secret Lookup via community.hashi_vault Task Module (AppRole)
  hosts: mini-lab
  vars:
    # Read environment variables injected by AWX Credential (or system env / extra vars)
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default('http://<SERVER_IP>:8200', true) }}"
    vault_role_id: "{{ lookup('env', 'VAULT_ROLE_ID') | default(role_id | default(''), true) }}"
    vault_secret_id: "{{ lookup('env', 'VAULT_SECRET_ID') | default(secret_id | default(''), true) }}"

  tasks:
    - name: Verify AppRole environment connection variables
      ansible.builtin.assert:
        that:
          - vault_role_id != ''
          - vault_secret_id != ''
        fail_msg: "VAULT_ROLE_ID or VAULT_SECRET_ID is missing! Make sure AppRole credentials are provided."
        success_msg: "AppRole credentials found for Vault at {{ vault_addr }}"

    - name: Fetch secrets from Vault using community.hashi_vault.vault_kv2_get TASK MODULE
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_addr }}"
        engine_mount_point: kv
        path: ansible
        auth_method: approle
        role_id: "{{ vault_role_id }}"
        secret_id: "{{ vault_secret_id }}"
      delegate_to: localhost
      register: vault_result

    - name: Extract secret key variables into facts
      ansible.builtin.set_fact:
        git_pat: "{{ vault_result.secret.git_pat | default('') }}"
        git_user: "{{ vault_result.secret.git_user | default('') }}"
        test_secret: "{{ vault_result.secret.test_secret | default('') }}"
        target_user: "{{ vault_result.secret.target_user | default('') }}"

    - name: Display retrieved secrets summary
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - " COMMUNITY.HASHI_VAULT TASK MODULE SUMMARY        "
          - "=================================================="
          - " Vault Server URL : {{ vault_addr }}"
          - " Git User         : {{ git_user }}"
          - " Target User      : {{ target_user }}"
          - " Git PAT Length   : {{ git_pat | length }} chars"
          - " Test Secret      : {{ test_secret[0:2] }}***{{ test_secret[-2:] if (test_secret | length) > 3 else '' }}"
          - "=================================================="
      no_log: false

    - name: Confirm secrets were extracted successfully
      ansible.builtin.assert:
        that:
          - git_pat != ''
          - git_user != ''
          - test_secret != ''
          - target_user != ''
        fail_msg: "Failed to extract secrets from kv/data/ansible in Vault using AppRole!"
        success_msg: "All secrets successfully fetched via community.hashi_vault.vault_kv2_get Task Module!"
