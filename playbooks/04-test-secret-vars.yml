---
- name: Direct Vault Secret Lookup via Native REST API (Zero EE Dependencies)
  hosts: targets
  vars:
    # Read environment variables injected by AWX Credential (or system env / extra vars)
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default('http://<YOUR_VAULT_SERVER_IP>:8200', true) }}"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"

  tasks:
    - name: Verify Vault environment connection variables
      ansible.builtin.assert:
        that:
          - vault_token != ''
        fail_msg: "VAULT_TOKEN environment variable is missing! Make sure your Vault Connection Info credential is attached in AWX."
        success_msg: "VAULT_TOKEN found. Connecting to Vault at {{ vault_addr }}"

    - name: Query Vault KV v2 API directly
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/kv/data/ansible"
        headers:
          X-Vault-Token: "{{ vault_token }}"
        method: GET
        status_code: 200
      register: vault_api_response

    - name: Extract secret key variables
      ansible.builtin.set_fact:
        git_pat: "{{ vault_api_response.json.data.data.git_pat | default('') }}"
        git_user: "{{ vault_api_response.json.data.data.git_user | default('') }}"
        test_secret: "{{ vault_api_response.json.data.data.test_secret | default('') }}"
        target_user: "{{ vault_api_response.json.data.data.target_user | default('') }}"

    - name: Display retrieved secrets summary
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - " DIRECT VAULT REST API LOOKUP SUMMARY              "
          - "=================================================="
          - " Vault Server URL : {{ vault_addr }}"
          - " Git User         : {{ git_user }}"
          - " Target User      : {{ target_user }}"
          - " Git PAT Length   : {{ git_pat | length }} chars"
          - " Test Secret      : {{ test_secret[0:2] }}***{{ test_secret[-2:] if (test_secret | length) > 3 else '' }}"
          - "=================================================="
      no_log: false

    - name: Confirm secrets were extracted successfully
      ansible.builtin.assert:
        that:
          - git_pat != ''
          - git_user != ''
          - test_secret != ''
          - target_user != ''
        fail_msg: "Failed to extract git_pat or git_user from kv/data/ansible in Vault!"
        success_msg: "All secrets successfully fetched directly from Vault via native API!"
