---
- name: Patch Linux Host Packages & Kernel Updates
  hosts: targets
  become: true
  vars:
    patch_action: "update"

  tasks:
    - name: Validate patch_action input
      ansible.builtin.assert:
        that:
          - patch_action | lower in ['update', 'upgrade']
        fail_msg: "Invalid patch_action '{{ patch_action }}'. Must be 'update' or 'upgrade'."

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: yes
        clean: yes
      register: apt_update_result
      when: patch_action | lower in ['update', 'upgrade']

    - name: Check for upgradable packages (UPDATE mode)
      ansible.builtin.command: apt list --upgradable
      register: upgradable_check
      changed_when: false
      when: patch_action | lower == 'update'

    - name: Upgrade all installed packages (UPGRADE mode)
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        dpkg_options: "force-confdef,force-confold"
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: apt_upgrade_result
      when: patch_action | lower == 'upgrade'

    - name: Check if system reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Display upgradable packages summary (UPDATE mode)
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - " UPDATE REPORT FOR: {{ inventory_hostname }}"
          - "=========================================="
          - " Upgradable Packages Count: {{ (upgradable_check.stdout_lines | default([]) | length) - 1 if (upgradable_check.stdout_lines | default([]) | length) > 1 else 0 }}"
          - " Reboot Required Currently: {{ 'YES' if reboot_required_file.stat.exists else 'NO' }}"
          - "------------------------------------------"
          - " Upgradable Packages List:"
          - "{{ upgradable_check.stdout_lines[1:] if (upgradable_check.stdout_lines | default([]) | length) > 1 else ['No packages need updating. System is up to date!'] }}"
          - "=========================================="
      when: patch_action | lower == 'update'

    - name: Display upgrade execution summary (UPGRADE mode)
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - " UPGRADE REPORT FOR: {{ inventory_hostname }}"
          - "=========================================="
          - " Status          : {{ 'Packages Upgraded Successfully!' if apt_upgrade_result.changed else 'System was already up to date.' }}"
          - " Reboot Required : {{ 'YES - Please reboot target host' if reboot_required_file.stat.exists else 'NO' }}"
          - "=========================================="
      when: patch_action | lower == 'upgrade'
