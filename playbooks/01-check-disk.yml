---
- name: Check disk usage playbook
  hosts: all
  tasks:
    - name: Check disk usage
      ansible.builtin.command: df -h /
      register: disk_check
      changed_when: false

    - name: Extract disk metrics
      ansible.builtin.set_fact:
        disk_details: "{{ disk_check.stdout_lines[1].split() }}"

    - name: Display human-readable disk status
      ansible.builtin.debug:
        msg:
          - "========================================"
          - " DISK REPORT FOR: {{ inventory_hostname }}"
          - "========================================"
          - " Filesystem : {{ disk_details[0] }}"
          - " Total Size : {{ disk_details[1] }}"
          - " Used Space : {{ disk_details[2] }}"
          - " Available  : {{ disk_details[3] }}"
          - " Usage %    : {{ disk_details[4] }}"
          - " Mount Point: {{ disk_details[5] }}"
          - "========================================"
