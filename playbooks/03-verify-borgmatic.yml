---
- name: Verify Borgmatic Backup Status
  hosts: mini-lab
  become: true
  tasks:
    - name: Read Borgmatic backup status file
      ansible.builtin.slurp:
        src: /var/lib/docker/volumes/k3s-data/_data/backup_status.json
      register: raw_status

    - name: Parse status JSON
      ansible.builtin.set_fact:
        backup_data: "{{ raw_status.content | b64decode | from_json }}"

    - name: Check if backup was successful
      ansible.builtin.assert:
        that:
          - backup_data.status == "success"
        fail_msg: "Last Borgmatic backup failed! Timestamp: {{ backup_data.timestamp }}"
        success_msg: "Borgmatic backup succeeded at {{ (backup_data.timestamp | int > 0) | ternary(('%Y-%m-%d %H:%M:%S' | strftime(backup_data.timestamp | int)), backup_data.timestamp) }}"
