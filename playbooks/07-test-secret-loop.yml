---
- name: Batch Fetch Secrets from Vault via YAML Manifest & Loop
  hosts: mini-lab
  vars_files:
    - ../vars/secrets.yml
  vars:
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default('http://<SERVER_IP>:8200', true) }}"
    vault_role_id: "{{ lookup('env', 'VAULT_ROLE_ID') | default(role_id | default(''), true) }}"
    vault_secret_id: "{{ lookup('env', 'VAULT_SECRET_ID') | default(secret_id | default(''), true) }}"

  tasks:
    - name: Fetch each secret path dynamically using loop item
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_addr }}"
        engine_mount_point: kv
        path: "{{ item.secret_path }}"
        auth_method: approle
        role_id: "{{ vault_role_id }}"
        secret_id: "{{ vault_secret_id }}"
      delegate_to: localhost
      loop: "{{ required_secrets }}"
      register: vault_batch_results
      no_log: true

    - name: Extract batch secrets dynamically into top-level Ansible facts
      ansible.builtin.set_fact:
        "{{ item.item.key_name }}": "{{ item.secret[item.item.key_name] | default('') }}"
      loop: "{{ vault_batch_results.results }}"
      no_log: true

    - name: Display retrieved secrets summary
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - " COMMUNITY.HASHI_VAULT BATCH LOOP SUMMARY         "
          - "=================================================="
          - " Vault Server URL : {{ vault_addr }}"
          - " Git User         : {{ git_user }}"
          - " Target User      : {{ target_user }}"
          - " Git PAT Length   : {{ git_pat | length }} chars"
          - " Test Secret      : {{ test_secret[0:2] }}***{{ test_secret[-2:] if (test_secret | default('') | length) > 3 else '' }}"
          - "=================================================="
      no_log: false