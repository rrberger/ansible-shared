---
- name: Webhook Event-Driven Automation Rulebook
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Trigger AWX Job Template on Incoming Webhook
      condition: event.payload.message == "ping"
      action:
        run_job_template:
          name: "Check Disk Space"
          organization: "Home Lab"
          job_args:
            extra_vars:
              triggered_by: "EDA Webhook Event"

    - name: Log Any Other Incoming Event
      condition: event.payload.message != "ping"
      action:
        debug:
          msg: "Received event payload: {{ event.payload }}"
